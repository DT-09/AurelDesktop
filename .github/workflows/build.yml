name: Build AUREL Desktop

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AurelDesktop.csproj

      - name: Build
        run: dotnet build AurelDesktop.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish AurelDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/AUREL-Desktop-win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUREL-Desktop-win-x64
          path: artifacts/AUREL-Desktop-win-x64/
          if-no-files-found: error
